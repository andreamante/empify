quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:empify}
quarkus.datasource.password=${DB_PASSWORD:empify_dev_password}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/empify_db}
quarkus.hibernate-orm.schema-management.strategy=none

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Range,Accept,Origin
quarkus.http.cors.exposed-headers=Accept-Ranges,Content-Range,Content-Length,Content-Type

quarkus.http.limits.max-body-size=100M
quarkus.http.body.delete-uploaded-files-on-end=true

mp.jwt.verify.issuer=empify
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:file:jwt/publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:file:jwt/privateKey.pem}
smallrye.jwt.new-token.issuer=empify

quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=Empify API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true