services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: empify_db
      POSTGRES_USER: ${DB_USER:-empify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-empify_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../Database/empifyDB.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/empify_db
      QUARKUS_DATASOURCE_USERNAME: ${DB_USER:-empify}
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD:-empify_dev_password}
      JWT_PRIVATE_KEY_LOCATION: file:/run/jwt/privateKey.pem
      JWT_PUBLIC_KEY_LOCATION: file:/run/jwt/publicKey.pem
    volumes:
      - jwt_keys:/run/jwt
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  jwt_keys:
